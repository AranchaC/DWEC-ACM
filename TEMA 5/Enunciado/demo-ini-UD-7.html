<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios en JavaScript</title>
  <script type="text/javascript" src="./eventos-ini.js" defer></script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body> 
  <h1> UD 5: Eventos y Formularios </h1>

  <form id="idFormulario" method="GET" action="#">
    <!-- ÁREA de INPUT TEXT --> 
    <label for="nombre">Nombre: </label>
      <input type="text" id="nombre" name="nombre" value="nombre" minlength="3" requiered>
      <span id="errorNombre" class="error"></span>
    <br><br>

    <label for="contraseña">Contraseña: </label>
      <input type="password" id="contraseña" name="contraseña" value="contraseña"> 
    <br><br>

    <input type="hidden" value="formulario-prueba">
    <br><br>

    <label for="edad">Edad: </label>
      <input type="number" id="edad" value="edad">
      <span id="errorEdad" class="error"></span>
    <br><br>
    
    <label for="color">Color: </label>
      <input type="color" id="color">
    <br><br>

    <label for="fecha">Fecha nacimiento: </label><br>
      <input type="date" id="fecha" name="fecha">
    <br><br>

    <!-- TEXTAREA -->
    <textarea id="area" name="area" rows="4" cols="50"></textarea>
    <span id="errorArea" class="error"></span>
    <br><br>

    <!-- ÁREA de RadioButton  -->    
    <label for="genero">Género: </label>
    <span id="errorGenero" class="error"></span>
    <br>
      <label for="hombre">Hombre: </label>
        <input type="radio" id="hombre" name="genero" value="hombre">
      <label for="mujer">Mujer: </label>
        <input type="radio" id="mujer" name="genero" value="mujer">
      <label for="otro">Otro: </label>
        <input type="radio" id="otro" name="genero" value="otro" >
    <br><br>

    <!-- ÁREA de checkbox  -->   
    <label for="check">Idiomas: </label><br>
    <label for="ingles">Inglés</label>
      <input type="checkbox" id="ingles" name="idioma" value="ingles">
    <label for="frances">Francés</label>
      <input type="checkbox" id="frances" name="idioma" value="frances">
    <label for="Español">Español</label>
      <input type="checkbox" id="español" name="idioma" value="español">
    <br><br>

    <!-- ÁREA de Select -->  
    <label for="aficiones">Aficiones: </label>
      <select name="aficiones" id="aficiones">
        <option value="musica">Música</option>
        <option value="lectura">Lectura</option>
        <option value="deportes">Deportes</option>
        <option value="arte">Arte</option>
        <option value="viajar">Viajar</option>
        <option value="cocinar">Cocinar</option>
      </select>
    <br><br>
    
    <!-- ÁREA de input list + DataList  --> 
    <label for="pelicula">Película preferida: </label>
    <input id="pelicula" list="listaPeliculas" name="pelicula_prefe">
      <datalist id="listaPeliculas">
          <option value="La vida es bella"></option>
          <option value="LA LA LAND"></option>
          <option value="Harry Potter"></option>
          <option value="Forrest Gump"></option>
          <option value="Star Wars"></option>
          <option value="Fast & Furious"></option>
      </datalist>

    

    <br>
    <br>

    <input id="idEnviar" type="button" value="Enviar"/>
         
  </form>
</body>
</html>
